{% extends "base.html" %}

{% block title %}Excluir Veículo | TESI Oficina{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-md-7 col-lg-6">

            <div class="card border-0 shadow-sm">
                <div class="card-body p-4 text-center">

                    <div class="mb-3">
                        <span class="text-danger" style="font-size: 3rem;">
                            ⚠
                        </span>
                    </div>

                    <h1 class="h4 mb-3">Excluir veículo?</h1>

                    <p class="text-muted">
                        Tem certeza de que deseja excluir este veículo?
                    </p>

                    <div class="alert alert-warning text-start">
                        <strong>{{ veiculo.modelo }} - {{ veiculo.placa }}</strong>
                        <br>
                        <small>Esta ação não poderá ser desfeita.</small>
                    </div>

                    <form method="post">
                        {% csrf_token %}

                        <div class="d-flex flex-column flex-sm-row justify-content-center gap-2 mt-4">
                            <a href="{% url 'lista_clientes' %}"
                               class="btn btn-outline-secondary">
                                Cancelar
                            </a>

                            <button type="submit" class="btn btn-danger">
                                Sim, excluir veículo
                            </button>
                        </div>
                    </form>

                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
